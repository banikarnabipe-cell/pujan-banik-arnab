name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    name: install → build → typecheck → deploy dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm (version pinned via packageManager)
        run: corepack enable pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (design-system → web)
        run: pnpm build

      - name: Typecheck (astro check — 0 errors gate)
        run: pnpm typecheck

      - name: Validate Cloudflare deployment (dry-run)
        run: pnpm exec wrangler deploy --dry-run

  # Production deploy from the canonical branch, after verification passes.
  # Credentials come exclusively from encrypted Actions secrets
  # (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID) — never committed, never
  # logged (GitHub masks secret values in workflow output). The token is
  # account-scoped with Workers Scripts permission only; the site is fully
  # static, so the Worker carries no runtime bindings or secrets.
  deploy:
    name: deploy → Cloudflare Workers (production)
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm (version pinned via packageManager)
        run: corepack enable pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare Workers (production)
        run: pnpm exec wrangler deploy --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test (live URL must serve the portfolio)
        run: |
          sleep 10
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            https://pujan-banik-arnab.banikarnab-ipe.workers.dev/)
          echo "live status: $code"
          [ "$code" = "200" ] || { echo "smoke test failed"; exit 1; }
